apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-gitops
  namespace: argocd
spec:
  project: default

  sources:
    - repoURL: git@github.com:le0418/tech-challenge-2.git
      targetRevision: main
      path: flask-chart
      helm:
        releaseName: flask-gitops
        valueFiles:
          - $values/gitops/values.yaml

    - repoURL: git@github.com:le0418/tech-challenge-2.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: flask-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true