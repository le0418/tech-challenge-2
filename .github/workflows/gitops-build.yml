name: GitOps - Build and Push Flask Image

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app/**"
      - ".github/workflows/gitops-build.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Diagnose GitHub OIDC context
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          echo "Repository: $GH_REPOSITORY"
          echo "Ref: $GH_REF"
          echo "Event: $GH_EVENT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::900160666800:role/TechChallenge2GitHubActionsECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: tech-challenge-2
          IMAGE_TAG: gitops-${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "Published image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Update GitOps image tag and push to GitHub
        env:
          IMAGE_TAG: gitops-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("gitops/values.yaml")
          content = path.read_text(encoding="utf-8")
          new_tag = os.environ["IMAGE_TAG"]

          updated, count = re.subn(
              r'(?m)^  tag: "gitops-[^"]+"$',
              f'  tag: "{new_tag}"',
              content,
          )

          if count != 1:
              raise SystemExit(
                  f"Expected exactly one GitOps image tag; found {count}"
              )

          path.write_text(updated, encoding="utf-8")
          print(f"Updated GitOps image tag to {new_tag}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/values.yaml

          if git diff --cached --quiet; then
            echo "GitOps image tag is already current."
          else
            git commit -m "gitops: deploy $IMAGE_TAG"
            git push origin HEAD:main
          fi