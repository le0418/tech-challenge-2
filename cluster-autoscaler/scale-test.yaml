apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler-scale-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaler-scale-test
  template:
    metadata:
      labels:
        app: autoscaler-scale-test
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1500m"
              memory: "64Mi"
            limits:
              memory: "128Mi"
